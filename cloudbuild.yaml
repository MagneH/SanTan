steps:
  # Install dependencies
  - name: 'node:22-alpine'
    entrypoint: npm
    args: ['ci']

  # Build the application
  - name: 'node:22-alpine'
    entrypoint: npm
    args: ['run', 'build', '--workspace=@santan/frontend']
    env:
      - 'NODE_ENV=production'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/santan-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/santan-frontend:latest'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '.'

  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/santan-frontend:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'santan-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/santan-frontend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/santan-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/santan-frontend:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'

