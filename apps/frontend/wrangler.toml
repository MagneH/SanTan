# Cloudflare Pages configuration for TanStack Start
name = "santan-frontend"
compatibility_date = "2025-11-04"

# Note: For Cloudflare Pages, deploy with:
# npm run deploy:cloudflare
# or: wrangler pages deploy .output/public --project-name=santan-frontend

# Environment variables (non-sensitive, public values)
# Set in Cloudflare Dashboard -> Pages -> Settings -> Environment variables
[vars]
VITE_BASE_PATH = "/"

# Local development
[dev]
port = 8787

