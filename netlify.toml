# Root Netlify configuration for monorepo
# Each Netlify site (frontend, studio) MUST set its own build settings in the Netlify UI.
# Publish directory now fully controlled via UI (publish removed here).
# Recommended UI settings:
#   Frontend: base=apps/frontend, build=npm run build:frontend, publish=apps/frontend/dist/client
#   Studio:   base=apps/studio,   build=npm run build:studio,   publish=apps/studio/dist

[build]
# No build command or publish here on purpose; UI settings take precedence.
# command = "npm run build:frontend"   # (Set per site in UI instead)
# base = "apps/frontend"               # (Optional; set in UI)

[build.environment]
NODE_VERSION = "24"
SECRETS_SCAN_ENABLED = "false"  # Set to true if you want secret scanning active.

# Add shared redirects/headers here ONLY if both sites need them.

[functions]
directory = ".netlify/v1/functions"
# Let Netlify use the already-built ESM function; do not re-bundle.
node_bundler = "none"
