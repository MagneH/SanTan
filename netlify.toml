# Root Netlify configuration for monorepo
# Dynamic build: chooses which workspace to build based on site name.
# Configure two Netlify sites pointing to this repo:
#   Frontend site: NETLIFY_SITE_NAME contains 'frontend' (recommended naming)
#   Studio site:   NETLIFY_SITE_NAME contains 'studio'
# Each site can override publish directory in the UI if desired.

[build]
command = "bash ./netlify-build.sh"
# Default publish (override per-site in UI):
publish = "dist"

[build.environment]
NODE_VERSION = "24"
SECRETS_SCAN_ENABLED = "false"

# You can override NODE_VERSION per site in the Netlify UI if needed.

# Redirects/headers can be added here if they are shared. Leave empty for now.
