# Root Netlify configuration for monorepo
# Each Netlify site points to this repo and MUST set its own build command & publish directory in the Netlify UI:
#   Frontend site:
#     Build command: npm run build:frontend
#     Publish directory: apps/frontend/dist/client
#   Studio site:
#     Build command: npm run build:studio
#     Publish directory: apps/studio/dist
# This file intentionally does not auto-build anything to avoid cross-workspace coupling.

[build]
command = "echo 'Configure build per site: npm run build:frontend OR npm run build:studio'"
publish = "dist"  # Placeholder; each site overrides in UI.

[build.environment]
NODE_VERSION = "24"
SECRETS_SCAN_ENABLED = "false"  # Set to true if you want Netlify secret scanning to fail on exposed public vars.

# Add shared redirects/headers here if BOTH sites need them. Otherwise use per-site _redirects/_headers in each workspace.
