[build]
base = "apps/frontend"
command = "npm run build"
publish = "apps/frontend/dist/client"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "24"

# Static asset bypass
[[redirects]]
from = "/assets/*"
to = "/assets/:splat"
status = 200

[[redirects]]
from = "/favicon.ico"
to = "/favicon.ico"
status = 200

# All other routes -> SSR
[[redirects]]
from = "/*"
to = "/.netlify/functions/ssr"
status = 200
