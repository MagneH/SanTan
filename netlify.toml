# Root Netlify configuration for monorepo
# NOTE: Each Netlify site (frontend, studio) MUST set its own build settings in the Netlify UI.
# Recommended site settings:
#   Frontend site:
#     Base directory: apps/frontend
#     Build command:  npm run build
#     Publish dir:    apps/frontend/dist/client
#   Studio site:
#     Base directory: apps/studio
#     Build command:  npm run build
#     Publish dir:    apps/studio/dist
# This file intentionally omits a build.command so the UI settings take precedence.

[build]
# No build command here on purpose; set per site in UI.
publish = "dist"  # Placeholder; UI overrides.

[build.environment]
NODE_VERSION = "24"
SECRETS_SCAN_ENABLED = "false"

# Add shared redirects/headers here if BOTH sites need them. Otherwise use per-site _redirects/_headers in each workspace.
