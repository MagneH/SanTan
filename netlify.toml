[build]
base = "/"
command = "npm --workspace=packages/shared run build && npm --workspace=@santan/frontend run build"
publish = "apps/frontend/dist/client"
functions = "apps/frontend/netlify/functions"

[build.environment]
NODE_VERSION = "24"
SECRETS_SCAN_OMIT_PATHS = "README.md,scripts/**,src/**"
SECRETS_SCAN_OMIT_KEYS = "VITE_SANITY_PROJECT_ID,VITE_SANITY_DATASET,VITE_SANITY_API_VERSION,VITE_SANITY_STUDIO_URL"

# Static asset bypass
[[redirects]]
from = "/assets/*"
to = "/assets/:splat"
status = 200

[[redirects]]
from = "/favicon.ico"
to = "/favicon.ico"
status = 200

# All other routes -> SSR
[[redirects]]
from = "/*"
to = "/.netlify/functions/ssr"
status = 200
